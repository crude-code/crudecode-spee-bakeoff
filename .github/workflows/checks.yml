name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src tests examples scripts
      - run: python -m pytest -q
      - run: python scripts/audit_public_history.py
      - run: python scripts/run_stress_board.py --seeds 1-3 --wells 24 --workers 1 --bootstrap-reps 50 --aggregate-bootstrap-reps 100 --report-only --out /tmp/stress-quick.json
      - run: python scripts/run_allocation_noise_evaluation.py --seeds 1-5 --wells 80 --out /tmp/allocation-quick.json
