[project]
name = "spee-bakeoff-forecast"
version = "1.1.0"
description = "Deterministic empirical DCA with paired multi-seed and real-holdout validation for the SPEE bake-off."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Only scripts/run_llm.py needs this; the library and scorer never do.
llm = [
    "anthropic>=0.100",
]
# Only scripts/extract_pads.py needs this; public tests and scoring do not.
snapshot = [
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
